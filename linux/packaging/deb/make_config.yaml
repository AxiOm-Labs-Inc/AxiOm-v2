display_name: AxiOm
# Не hiddify: пакет с этим именем — настоящий Hiddify, apt заменил бы его нашим.
package_name: axiom
maintainer:
  name: AxiOm
  # TODO: адрес для Linux-пакета не заведён; Linux-сборки не выпускаются.
  email: ""

priority: optional
section: x11
installed_size: 6604
essential: false
icon: assets/images/source/ic_launcher_border.png

# Post-installation tasks:
# 1. Inject StartupWMClass into the system .desktop file for correct icon association
# 2. Remove conflicting axiom.desktop files from users' .local directories (cleanup AppImage artifacts)
# 3. Update the desktop database to apply changes immediately
postinstall_scripts:
  - echo "Setting up AxiOm..."
  - sudo sed -i '/^\[Desktop Entry\]/a StartupWMClass=app.axiom' "/usr/share/applications/axiom.desktop"
  - echo "Search and remove axiom.desktop from .local"
  - for user_dir in /home/*; do if [ -f "$user_dir/.local/share/applications/axiom.desktop" ]; then rm -f "$user_dir/.local/share/applications/axiom.desktop"; echo "Found and removed axiom.desktop from $user_dir .local"; fi; done
  - update-desktop-database /usr/share/applications
  - echo "AxiOm is ready to use :)"

# Post-uninstallation tasks:
# 1. Iterate through all user directories to remove AxiOm configuration and data
# 2. Clean up root user data to ensure a clean removal
postuninstall_scripts:
  # Каталог данных = APPLICATION_ID (path_provider на Linux). Чужой
  # ~/.local/share/hiddify не трогаем — он принадлежит настоящему Hiddify.
  - echo "Removing AxiOm user data..."
  - for user_dir in /home/*; do if [ -d "$user_dir/.local/share/app.axiom" ]; then rm -rf "$user_dir/.local/share/app.axiom"; echo "Removed data from $user_dir"; fi; done
  - rm -rf /root/.local/share/app.axiom
  - echo "AxiOm data cleanup complete."

keywords:
  - AxiOm
  - Proxy
  - VPN
  - V2ray
  - Nekoray
  - Xray
  - Psiphon
  - OpenVPN

generic_name: AxiOm

categories:
  - Network

startup_notify: true
# app_links setup for Linux
# https://github.com/llfbandit/app_links/blob/master/doc/README_linux.md
# Только своя схема — как на Windows (LinkParser.ownProtocols).
supported_mime_type:
  - x-scheme-handler/axiom

